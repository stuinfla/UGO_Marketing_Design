<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand/styles.css">
<style>
  html,body{margin:0;background:#d9d9d2;}
  .slide{position:relative;width:1280px;height:720px;background:var(--ugo-royal-blue);overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 96px;box-sizing:border-box;}
  .num{font-family:var(--font-display);font-weight:900;font-size:30px;color:var(--ugo-light-teal);letter-spacing:.04em;}
  h1{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:104px;line-height:.95;color:var(--ugo-beige);margin:14px 0 0;max-width:14ch;}
  .rule{width:64px;height:4px;background:var(--ugo-lime);margin-top:34px;}
  .sil{position:absolute;right:-60px;top:50%;transform:translateY(-50%);height:760px;opacity:.16;}
</style>
</head>
<body>
  <div class="slide">
    <img class="sil" src="../assets/profiles/inv02.png" alt="">
    <span class="num">02</span>
    <h1>Where we work</h1>
    <div class="rule"></div>
  </div>
</body>
</html>
