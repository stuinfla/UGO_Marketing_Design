<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); display: grid; grid-template-columns: 1fr 1fr; }
  .pane { padding: 40px; display: flex; align-items: center; justify-content: center; min-height: 220px; }
  .pane.ink { background: var(--ugo-royal-blue); }

</style>
</head>
<body>
  <div class="pane"><img src="../assets/logos/UGO_Logo_horizontal.png" alt="U-GO"></div>
  <div class="pane ink"><img src="../assets/logos/UGO_Logo_horizontal_light.png" alt="U-GO reversed"></div>
</body>
</html>
