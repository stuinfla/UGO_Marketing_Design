<!-- @dsCard group="Colors" viewport="700x230" name="Deep palette" subtitle="Dark cuts of each hue — for ink, dark sections, deep type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface-page); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .chip { height: 76px; }
  .lab { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--text-body); padding: 8px 10px 0; line-height: 1.3; }
  .hex { font-family: var(--font-display); font-weight: 900; font-size: 11px; color: var(--text-muted); padding: 1px 10px 9px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--ugo-royal-blue-deep)"></div><div class="lab">Royal Blue</div><div class="hex">#12213B</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-dark-teal-deep)"></div><div class="lab">Dark Teal</div><div class="hex">#1C3B40</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-light-teal-deep)"></div><div class="lab">Light Teal</div><div class="hex">#0A2E1C</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-dark-green-deep)"></div><div class="lab">Dark Green</div><div class="hex">#292B08</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-lime-deep)"></div><div class="lab">Lime</div><div class="hex">#242905</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-orange-deep)"></div><div class="lab">Orange</div><div class="hex">#30210A</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-cornflower-deep)"></div><div class="lab">Cornflower</div><div class="hex">#262B3B</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-pink-deep)"></div><div class="lab">Pink</div><div class="hex">#331C2E</div></div>
  </div>
</body>
</html>
