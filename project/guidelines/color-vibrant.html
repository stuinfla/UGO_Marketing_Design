<!-- @dsCard group="Colors" viewport="700x230" name="Vibrant palette" subtitle="The eight campaign hues — used full-strength in watercolor & charts" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface-page); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .chip { height: 76px; }
  .lab { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--text-body); padding: 8px 10px 0; line-height: 1.3; }
  .hex { font-family: var(--font-display); font-weight: 900; font-size: 11px; color: var(--text-muted); padding: 1px 10px 9px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--ugo-royal-blue)"></div><div class="lab">Royal Blue</div><div class="hex">#1C3B40</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-dark-teal)"></div><div class="lab">Dark Teal</div><div class="hex">#4F9EB0</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-light-teal)"></div><div class="lab">Light Teal</div><div class="hex">#80DEBA</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-dark-green)"></div><div class="lab">Dark Green</div><div class="hex">#6B7D08</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-lime)"></div><div class="lab">Lime</div><div class="hex">#BAD626</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-orange)"></div><div class="lab">Orange</div><div class="hex">#FFBA29</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-cornflower)"></div><div class="lab">Cornflower</div><div class="hex">#94B2FF</div></div>
    <div class="sw"><div class="chip" style="background:var(--ugo-pink)"></div><div class="lab">Pink</div><div class="hex">#FFA3E5</div></div>
  </div>
</body>
</html>
