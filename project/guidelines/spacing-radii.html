<!-- @dsCard group="Spacing" viewport="700x210" name="Radii" subtitle="Soft corners; pill for buttons, tags & chips" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--surface-page); }
  .grid { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
  .item { text-align: center; }
  .box { width: 86px; height: 64px; background: var(--ugo-white); border: 1.5px solid var(--ugo-royal-blue); }
  .lab { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .pill { width: 110px; height: 40px; border-radius: var(--radius-pill); }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab">sm · 8</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab">md · 14</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab">lg · 22</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab">xl · 32</div></div>
    <div class="item"><div class="box pill"></div><div class="lab">pill · buttons</div></div>
  </div>
</body>
</html>
