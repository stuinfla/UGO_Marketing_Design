<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing scale" subtitle="8px base · generous, print-rooted rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 30px 32px; background: var(--surface-page); }
  .row { display: flex; align-items: center; gap: 14px; margin-bottom: 11px; }
  .bar { height: 18px; background: var(--ugo-dark-teal); border-radius: 3px; }
  .lab { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
</style>
</head>
<body>
  <div class="row"><div class="bar" style="width:4px"></div><span class="lab">1 · 4px</span></div>
  <div class="row"><div class="bar" style="width:8px"></div><span class="lab">2 · 8px</span></div>
  <div class="row"><div class="bar" style="width:16px"></div><span class="lab">4 · 16px</span></div>
  <div class="row"><div class="bar" style="width:32px"></div><span class="lab">6 · 32px</span></div>
  <div class="row"><div class="bar" style="width:64px"></div><span class="lab">10 · 64px</span></div>
  <div class="row"><div class="bar" style="width:128px"></div><span class="lab">16 · 128px</span></div>
</body>
</html>
