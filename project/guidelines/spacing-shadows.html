<!-- @dsCard group="Spacing" viewport="700x210" name="Shadows" subtitle="Quiet, warm-tinted elevation — never harsh" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 34px 32px; background: var(--surface-page); }
  .grid { display: flex; gap: 28px; }
  .item { text-align: center; flex: 1; }
  .box { height: 70px; background: var(--ugo-white); border-radius: var(--radius-md); }
  .lab { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--text-muted); margin-top: 14px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lab">sm · hairline lift</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lab">md · cards</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab">lg · dialogs / overlays</div></div>
  </div>
</body>
</html>
