<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 32px 36px; background: var(--surface-page); }
  .row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .tag { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--text-muted); text-transform: none; letter-spacing: 0; }
  .big { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; color: var(--text-primary); line-height: 0.95; letter-spacing: 0.005em; margin: 0; }
</style>
</head>
<body>
  <p class="big" style="font-size: 72px;">U-GO</p>
  <p class="big" style="font-size: 40px; margin-top: 14px;">Talent is universal</p>
  <div class="row" style="margin-top: 18px;">
    <span class="big" style="font-size: 22px; letter-spacing: 0.12em;">MEET THE SCHOLARS</span>
    <span class="tag">MD IO Black · uppercase · tracking 0.12em for labels</span>
  </div>
</body>
</html>
