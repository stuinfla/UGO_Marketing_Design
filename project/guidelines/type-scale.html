<!-- @dsCard group="Type" viewport="700x340" name="Type scale" subtitle="From poster stat to fine print" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 36px; background: var(--surface-page); color: var(--text-primary); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: baseline; gap: 18px; border-bottom: 1px solid var(--border-hairline); padding: 7px 0; }
  .s { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; line-height: 1; color: var(--text-primary); flex: 1; white-space: nowrap; overflow: hidden; }
  .m { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
</style>
</head>
<body>
  <ul>
    <li><span class="s" style="font-size: 56px;">98%</span><span class="m">5xl · 88px · stat hero</span></li>
    <li><span class="s" style="font-size: 38px;">Headline</span><span class="m">2xl · 36px · h2</span></li>
    <li><span class="s" style="font-size: 26px;">Subhead</span><span class="m">xl · 28px · h3</span></li>
    <li><span class="s" style="font-size: 16px; letter-spacing:.12em;">LABEL / EYEBROW</span><span class="m">sm · 14px · 0.12em</span></li>
  </ul>
</body>
</html>
