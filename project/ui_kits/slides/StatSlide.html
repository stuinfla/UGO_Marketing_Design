<!-- @dsCard group="Slides" viewport="1280x720" name="Impact stats" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;background:#d9d9d2;}
  .slide{width:1280px;height:720px;background:var(--ugo-beige);box-sizing:border-box;padding:72px 80px;display:flex;flex-direction:column;}
  .eyebrow{font-family:var(--font-display);font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:16px;color:var(--ugo-dark-teal);display:flex;align-items:center;gap:14px;}
  .eyebrow::before{content:"";width:30px;height:3px;background:currentColor;}
  h2{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:48px;color:var(--ugo-royal-blue);margin:14px 0 0;}
  .row{display:flex;gap:24px;justify-content:space-between;align-items:flex-start;margin-top:auto;}
  .stat{position:relative;width:340px;text-align:center;}
  .stat img{width:100%;height:auto;display:block;}
  .stat figcaption{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:9%;}
  .big{font-family:var(--font-display);font-weight:900;font-size:96px;line-height:.9;color:var(--ugo-royal-blue);}
  .big sup{font-size:.42em;}
  .cap{font-family:var(--font-body);font-weight:400;font-size:16px;color:var(--ugo-royal-blue);max-width:64%;margin-top:6px;line-height:1.3;}
</style>
</head>
<body>
  <div class="slide">
    <span class="eyebrow">Our impact</span>
    <h2>Why investing in her works</h2>
    <div class="row">
      <figure class="stat"><img src="../../assets/profiles/p05.png" alt=""><figcaption><span class="big">98<sup>%</sup></span><span class="cap">of U-GO scholars advance to the next grade</span></figcaption></figure>
      <figure class="stat"><img src="../../assets/profiles/p04.png" alt=""><figcaption><span class="big">90<sup>%</sup></span><span class="cap">of a woman's income is invested back into her family</span></figcaption></figure>
      <figure class="stat"><img src="../../assets/profiles/p01.png" alt=""><figcaption><span class="big">96<sup>%</sup></span><span class="cap">of women in Cambodia do not attend university</span></figcaption></figure>
    </div>
  </div>
</body>
</html>
