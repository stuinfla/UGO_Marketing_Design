<!-- @dsCard group="Slides" viewport="1280x720" name="Title slide" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;background:#d9d9d2;}
  .slide{position:relative;width:1280px;height:720px;background:var(--ugo-beige);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:64px 72px;box-sizing:border-box;}
  .logo{height:34px;width:auto;align-self:flex-start;}
  .eyebrow{font-family:var(--font-display);font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:16px;color:var(--ugo-dark-teal);}
  h1{font-family:var(--font-serif);font-weight:400;text-transform:none;letter-spacing:0;font-size:84px;line-height:1.0;color:var(--ugo-royal-blue);margin:18px 0 0;}
  .meta{font-family:var(--font-body);font-weight:400;font-size:18px;color:var(--text-body);}
  .profiles{position:absolute;right:-40px;bottom:-30px;display:flex;align-items:flex-end;}
  .profiles img{height:520px;}
  .profiles img:nth-child(1){height:420px;margin-right:-120px;}
  .content{position:relative;z-index:2;max-width:760px;}
</style>
</head>
<body>
  <div class="slide">
    <div class="profiles">
      <img src="../../assets/profiles/p02.png" alt="">
      <img src="../../assets/profiles/p01.png" alt="">
    </div>
    <img class="logo" src="../../assets/logos/UGO_Logo_horizontal_trim.png" alt="U-GO University">
    <div class="content">
      <span class="eyebrow">Annual Impact Report · 2024</span>
      <h1>Talent is universal,<br><em>opportunity is not.</em></h1>
    </div>
    <div class="meta">ugouniversity.org</div>
  </div>
</body>
</html>
